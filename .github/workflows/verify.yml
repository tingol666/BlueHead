name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install fixed Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Lint and protocol/audio regression checks
        run: |
          python -m ruff check bluehead tools tests launch.py engine_launch.py
          python -m pytest tests -q --tb=short
      - name: Build desktop and helper with fixed NuGet dependencies
        run: |
          dotnet build desktop/BlueHead.Desktop/BlueHead.Desktop.csproj -c Release -r win-x64 -p:RestoreLockedMode=true
          dotnet build desktop/BlueHead.DriverHelper/BlueHead.DriverHelper.csproj -c Release -r win-x64 -p:RestoreLockedMode=true
      # Hardware and driver operations run only during real-device acceptance.
