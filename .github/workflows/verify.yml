name: Windows verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_only:
        description: Run desktop diagnostics without rebuilding unchanged native audio
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: msys2/setup-msys2@v2
        if: github.event_name != 'workflow_dispatch' || !inputs.ui_only
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make diffutils
      - name: Install fixed Python dependencies
        if: github.event_name != 'workflow_dispatch' || !inputs.ui_only
        run: python -m pip install -r requirements.lock.txt
      - name: Build native components from source
        if: github.event_name != 'workflow_dispatch' || !inputs.ui_only
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $nativeTool = Join-Path $env:MSYS2_ROOT 'ucrt64\bin'
          $nativeShell = Join-Path $env:MSYS2_ROOT 'usr\bin'
          $env:PATH = "$nativeTool;$nativeShell;" + $env:PATH
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nativeTool
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nativeShell
          python tools/sync_version.py --check
          python tools/build_all_native.py
      - name: Lint and built-in offline audio diagnostics
        if: github.event_name != 'workflow_dispatch' || !inputs.ui_only
        run: |
          python -m ruff check bluehead tools launch.py engine_launch.py
          python engine_launch.py --offline-audio-check offline-native.json
      - name: Build desktop and helper with fixed NuGet dependencies
        run: |
          dotnet build desktop/BlueHead.Desktop/BlueHead.Desktop.csproj -c Release -p:RestoreLockedMode=true
          dotnet build desktop/BlueHead.DriverHelper/BlueHead.DriverHelper.csproj -c Release -p:RestoreLockedMode=true
      - name: Built-in desktop diagnostics
        shell: pwsh
        run: |
          # Hosted runners have virtual displays. Use WPF's documented software
          # rasterizer for deterministic snapshots; this affects only this VM.
          New-Item -Path 'HKCU:\SOFTWARE\Microsoft\Avalon.Graphics' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:\SOFTWARE\Microsoft\Avalon.Graphics' -Name DisableHWAcceleration -Value 1 -PropertyType DWord -Force | Out-Null
          $taskUi = Start-Process -FilePath desktop/BlueHead.Desktop/bin/Release/net48/BlueHead.exe -ArgumentList '--self-test', ui-checks -WindowStyle Hidden -PassThru -RedirectStandardOutput ui-stdout.txt -RedirectStandardError ui-stderr.txt
          if (-not $taskUi.WaitForExit(120000)) {
            $taskUi.Refresh()
            $taskUi | Select-Object Id,TotalProcessorTime,UserProcessorTime,PrivilegedProcessorTime | ConvertTo-Json | Set-Content ui-process.json
            # Capture method names only, never heap objects or process dumps.
            try {
              New-Item -ItemType Directory -Path work/ui-stack -Force | Out-Null
              @'
            <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><PackageReference Include="Microsoft.Diagnostics.Runtime" Version="3.1.512801" /></ItemGroup></Project>
          '@ | Set-Content work/ui-stack/UiStack.csproj
              @'
            using Microsoft.Diagnostics.Runtime;
            using var target = DataTarget.AttachToProcess(int.Parse(args[0]), suspend: true);
            foreach (var info in target.ClrVersions) {
              using var runtime = info.CreateRuntime();
              foreach (var thread in runtime.Threads.Where(t => t.IsAlive)) {
                Console.WriteLine($"THREAD {thread.ManagedThreadId} OS {thread.OSThreadId:x}");
                foreach (var frame in thread.EnumerateStackTrace().Take(80)) Console.WriteLine(frame.ToString());
              }
            }
          '@ | Set-Content work/ui-stack/Program.cs
              dotnet publish work/ui-stack/UiStack.csproj -c Release -o work/ui-stack-bin
              $taskStack = Start-Process -FilePath work/ui-stack-bin/UiStack.exe -ArgumentList $taskUi.Id -WindowStyle Hidden -PassThru -RedirectStandardOutput ui-managed-stacks.txt -RedirectStandardError ui-stack-error.txt
              if (-not $taskStack.WaitForExit(45000)) { $taskStack.Kill($true) }
            } catch { $_.Exception.Message | Set-Content ui-stack-error.txt }
            $taskUi.Kill($true)
            throw 'Desktop diagnostics exceeded two minutes; inspect captured reports'
          }
          if ($taskUi.ExitCode -ne 0) { throw 'UI checks failed' }
          $taskResult = Get-Content -LiteralPath ui-checks/desktop-self-test.json -Raw | ConvertFrom-Json
          if (-not $taskResult.passed) { throw 'Desktop diagnostic report did not pass' }
      - name: Save diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            offline-native.json
            ui-checks/
            ui-stdout.txt
            ui-stderr.txt
            ui-process.json
            ui-managed-stacks.txt
            ui-stack-error.txt
      # Hardware and driver operations run only during real-device acceptance.
