name: Windows verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make diffutils
      - name: Install fixed Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Build native components from source
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $nativeTool = Join-Path $env:MSYS2_ROOT 'ucrt64\bin'
          $nativeShell = Join-Path $env:MSYS2_ROOT 'usr\bin'
          $env:PATH = "$nativeTool;$nativeShell;" + $env:PATH
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nativeTool
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $nativeShell
          python tools/sync_version.py --check
          python tools/build_all_native.py
      - name: Lint and protocol/audio regression checks
        run: |
          python -m ruff check bluehead tools tests launch.py engine_launch.py
          python -m pytest tests -q --tb=short
          python engine_launch.py --offline-audio-check offline-native.json
      - name: Build desktop and helper with fixed NuGet dependencies
        run: |
          dotnet build desktop/BlueHead.Desktop/BlueHead.Desktop.csproj -c Release -p:RestoreLockedMode=true
          dotnet build desktop/BlueHead.DriverHelper/BlueHead.DriverHelper.csproj -c Release -p:RestoreLockedMode=true
          dotnet build desktop/BlueHead.FrameworkChecks/BlueHead.FrameworkChecks.csproj -c Release -p:RestoreLockedMode=true
      - name: Framework compatibility and in-memory UI checks
        shell: pwsh
        run: |
          $taskChecks = Start-Process -FilePath desktop/BlueHead.FrameworkChecks/bin/Release/net48/BlueHead.FrameworkChecks.exe -ArgumentList framework-checks -WindowStyle Hidden -Wait -PassThru
          if ($taskChecks.ExitCode -ne 0) { throw 'Framework compatibility checks failed' }
          $taskUi = Start-Process -FilePath desktop/BlueHead.Desktop/bin/Release/net48/BlueHead.exe -ArgumentList '--self-test', ui-checks -WindowStyle Hidden -Wait -PassThru
          if ($taskUi.ExitCode -ne 0) { throw 'UI checks failed' }
      # Hardware and driver operations run only during real-device acceptance.
