[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bluehead"
version = "2.1.5"
description = "Local Windows Bluetooth media receiver and hands-free audio"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = ["bumble", "winrt-Windows.Media.Audio", "winrt-Windows.Devices.Enumeration", "winrt-Windows.Foundation", "winrt-Windows.Foundation.Collections"]

[project.optional-dependencies]
test = ["av", "numpy", "pytest", "pytest-asyncio", "ruff"]
build = ["pyinstaller", "pefile"]

[project.urls]
Homepage = "https://github.com/tingol666/BlueHead"
Repository = "https://github.com/tingol666/BlueHead"
Issues = "https://github.com/tingol666/BlueHead/issues"

[tool.setuptools.packages.find]
include = ["bluehead*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 115

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
